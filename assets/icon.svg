<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="256" height="256" rx="40" fill="#667eea"/>

  <!-- QR码外框 -->
  <rect x="48" y="48" width="160" height="160" rx="8" fill="white"/>

  <!-- QR码左上角 -->
  <rect x="64" y="64" width="48" height="48" fill="#667eea"/>
  <rect x="72" y="72" width="32" height="32" fill="white"/>
  <rect x="80" y="80" width="16" height="16" fill="#667eea"/>

  <!-- QR码右上角 -->
  <rect x="144" y="64" width="48" height="48" fill="#667eea"/>
  <rect x="152" y="72" width="32" height="32" fill="white"/>
  <rect x="160" y="80" width="16" height="16" fill="#667eea"/>

  <!-- QR码左下角 -->
  <rect x="64" y="144" width="48" height="48" fill="#667eea"/>
  <rect x="72" y="152" width="32" height="32" fill="white"/>
  <rect x="80" y="160" width="16" height="16" fill="#667eea"/>

  <!-- QR码中间点缀 -->
  <rect x="128" y="128" width="16" height="16" fill="#667eea"/>
  <rect x="160" y="128" width="16" height="16" fill="#667eea"/>
  <rect x="128" y="160" width="16" height="16" fill="#667eea"/>
  <rect x="176" y="160" width="16" height="16" fill="#667eea"/>
  <rect x="144" y="176" width="16" height="16" fill="#667eea"/>

  <!-- 扫描线效果 -->
  <rect x="48" y="120" width="160" height="3" fill="#ff6b6b" opacity="0.6"/>
</svg>
