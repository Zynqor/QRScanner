name: Build QR Scanner

on:
  push:
    branches:
      - claude/**
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run build:win

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-Windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-macOS
          path: |
            dist/*.dmg
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/claude/cross-platform-startup-app-011CUqyRFgd5TCHN4F4nW1sc'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ steps.date.outputs.date }}
          name: QR Scanner Build ${{ steps.date.outputs.date }}
          body: |
            ## 自动构建版本

            构建时间: ${{ steps.date.outputs.date }}
            提交: ${{ github.sha }}

            ### 下载说明

            **Windows 用户**:
            - 下载 `QR Scanner Setup 1.0.0.exe`
            - 双击安装，如提示"Windows 已保护你的电脑"，点击"更多信息" → "仍要运行"

            **macOS 用户**:
            - 下载 `.dmg` 文件
            - 打开后拖拽到应用程序文件夹
            - 首次运行需右键点击 → "打开"

            ### 功能特性
            - ✅ 快捷键截图识别二维码（默认 Ctrl+Shift+Q）
            - ✅ 系统托盘运行
            - ✅ 开机自启动
            - ✅ 自动打开网址或显示文本
          files: |
            artifacts/QRScanner-Windows/*
            artifacts/QRScanner-macOS/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
