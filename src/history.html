<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史记录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #F3F3F3;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 20px;
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5E5;
    }

    .header h1 {
      color: #1F1F1F;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 8px 32px 8px 12px;
      border: 1px solid #8A8886;
      border-radius: 2px;
      font-size: 14px;
      font-family: "Segoe UI", sans-serif;
    }

    .search-box input:focus {
      outline: none;
      border-color: #0078D4;
      border-width: 2px;
      padding: 7px 31px 7px 11px;
    }

    .search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #605E5C;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .history-item {
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 2px;
      margin-bottom: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .history-item:hover {
      background: #F3F2F1;
      border-color: #0078D4;
    }

    .history-item-content {
      flex: 1;
      min-width: 0;
    }

    .history-item-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .type-url {
      background: #E1F5FE;
      color: #0078D4;
    }

    .type-text {
      background: #F3F2F1;
      color: #323130;
    }

    .history-item-text {
      color: #323130;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-all;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .history-item-time {
      color: #605E5C;
      font-size: 11px;
    }

    .history-item-delete {
      padding: 4px 8px;
      color: #A19F9D;
      font-size: 12px;
      cursor: pointer;
      border-radius: 2px;
      margin-left: 8px;
    }

    .history-item-delete:hover {
      background: #EDEBE9;
      color: #D13438;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #605E5C;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid #E5E5E5;
      background: #FFFFFF;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 20px;
      border: 1px solid #8A8886;
      border-radius: 2px;
      font-size: 14px;
      cursor: pointer;
      background: #FFFFFF;
      color: #323130;
      flex: 1;
    }

    .btn:hover {
      background: #F3F2F1;
    }

    .btn-danger {
      color: #D13438;
      border-color: #D13438;
    }

    .btn-danger:hover {
      background: #FEF0F1;
    }

    .history-list::-webkit-scrollbar {
      width: 12px;
    }

    .history-list::-webkit-scrollbar-track {
      background: #F3F2F1;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: #C8C6C4;
      border-radius: 6px;
    }

    .history-list::-webkit-scrollbar-thumb:hover {
      background: #A19F9D;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>识别历史</h1>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索历史记录...">
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <div class="history-list" id="historyList">
      <!-- 历史记录项将动态添加到这里 -->
    </div>

    <div class="footer">
      <button class="btn" id="closeBtn">关闭</button>
      <button class="btn btn-danger" id="clearBtn">清空历史</button>
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
